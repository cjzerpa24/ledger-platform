spring:
  application:
    name: reconciliation-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
server:
  port: 8080
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
reconciliation:
  ledger-base-url: ${LEDGER_BASE_URL:http://ledger-service}
  ledger-timeout-ms: ${LEDGER_TIMEOUT_MS:5000}
  match-window-days: ${MATCH_WINDOW_DAYS:2}
